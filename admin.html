<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Submissions - PT. AIS</title>
    <link rel="icon" href="assets/img/Logo AIS.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="" class="logo-link">
                    <img src="assets/img/Logo AIS.png" alt="Logo AIS" style="height: 50px;">
                    <span class="logo-text">PT. Alkon Indo Sertifikasi</span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="admin.html" class="nav-link active-link">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header-section">
            <img src="assets/img/gambar/Index10.jpg" alt="Background Admin" class="header-bg-image">
            <div class="header-overlay">
                <div class="container">
                    <h1>Admin Submissions</h1>
                    <div class="breadcrumb">
                        <a href="index.html">Home</a> / Admin
                    </div>
                </div>
            </div>
        </section>

        <section class="admin-section light-bg">
            <div class="admin-toolbar">
                <select id="submission-type">
                    <option value="all">Semua Form</option>
                    <option value="penawaran">Penawaran</option>
                    <option value="kontak">Kontak</option>
                </select>
                <div id="admin-session" class="admin-session">Belum login</div>
                <button id="refresh-button" type="button">Refresh Data</button>
                <button id="logout-button" type="button" class="admin-logout-btn">Logout</button>
            </div>

            <div id="admin-feedback" class="form-success hidden"></div>

            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Waktu</th>
                            <th>Tipe</th>
                            <th>Nama Perusahaan</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Telepon</th>
                            <th>Layanan</th>
                            <th>Subjek</th>
                            <th>Pesan</th>
                        </tr>
                    </thead>
                    <tbody id="submission-body">
                        <tr>
                            <td colspan="10" class="admin-empty">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const isLiveServer = window.location.port === '5500';
            window.AIS_API_CONFIG = {
                baseUrl: isLiveServer ? 'http://localhost:5001' : ''
            };
        })();
    </script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
